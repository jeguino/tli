<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #2b3a4a;
            color: #fff;
            padding: 2rem;
            text-align: center;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            flex: 1;
        }
        h1 {
            margin-bottom: 0.5rem;
        }
        p {
            margin-bottom: 1rem;
        }
        .btn {
            display: inline-block;
            background: #007bff;
            color: #fff;
            padding: 0.5rem 1.5rem;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background: #0056b3;
        }
        footer {
            text-align: center;
            padding: 1rem;
            background: #2b3a4a;
            color: #fff;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>¡Bienvenido a mi sitio web!</h1>
        <p>Creado y alojado gracias a GitHub Pages</p>
    </header>

    <main>
        <h2>Sobre mí</h2>
        <p>Esta es mi primera página web. Aquí puedo compartir mis proyectos, ideas o portafolio personal.</p>
        <a href="#" class="btn">Saber más</a>
    </main>

    <footer>
        <p>&copy; 2026 - Todos los derechos reservados</p>
    </footer>

</body>
</html>
